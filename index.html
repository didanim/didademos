<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dida's Script Lair</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
        :root {
            --ios-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --ios-blur: blur(20px);
            --ios-glass: rgba(255, 255, 255, 0.3);
            --ios-dark-glass: rgba(0, 0, 0, 0.4);
            --font-ios: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --icon-radius: 22%; 
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-ios);
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000 url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: white;
        }

        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
        }

        .notch {
            width: 160px;
            height: 30px;
            background: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }          
        .home-screen {
            flex: 1;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-auto-rows: 110px;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-icon:active {
            transform: scale(0.9);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: var(--icon-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 35px;
        }

        .app-icon span {
            font-size: 12px;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            text-align: center;
        }

        .bg-calendar { background: linear-gradient(#ff5e57, #ff3b30); color: white; }
        .bg-safari { background: #fff; color: #007aff; }
        .bg-books { background: linear-gradient(#ffcc00, #ffb300); color: white; }

        .dock-wrapper {
            padding: 20px;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .dock {
            background: var(--ios-glass);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            padding: 12px 15px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dock .icon-box {
            margin-bottom: 0;
            width: 55px;
            height: 55px;
        }

        .home-indicator {
            width: 120px;
            height: 5px;
            background: white;
            border-radius: 10px;
            margin: 0 auto 8px;
            opacity: 0.8;
        }

        @media (max-width: 400px) {
            .home-screen { grid-template-columns: repeat(4, 1fr); }
            .status-bar { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <div class="notch"></div>
    
    <div class="status-bar">
        <span id="ios-clock">9:41</span>
        <div style="display: flex; gap: 6px; align-items: center;">
            <iconify-icon icon="fluent:cellular-data-5-24-filled"></iconify-icon>
            <iconify-icon icon="fluent:wifi-1-24-filled"></iconify-icon>
            <iconify-icon icon="fluent:battery-charge-24-filled"></iconify-icon>
        </div>
    </div>

    <div class="home-screen">
        <a href="daily-release-schedule/index.html" class="app-icon">
            <div class="icon-box bg-calendar">
                <iconify-icon icon="wpf:calendar"></iconify-icon>
            </div>
            <span>Schedule</span>
        </a>

        <a href="anime-list-sitemap/index.html" class="app-icon">
            <div class="icon-box bg-safari">
                <iconify-icon icon="logos:safari"></iconify-icon>
            </div>
            <span>Sitemap</span>
        </a>

        <a href="https://didanim.github.io/didademos/3d-minimalist-bookshelf/index.html" class="app-icon">
            <div class="icon-box bg-books">
                <iconify-icon icon="fluent:library-24-filled"></iconify-icon>
            </div>
            <span>Library</span>
        </a>
    </div>

    <div class="dock-wrapper">
        <div class="dock">
            <div class="icon-box" style="background: linear-gradient(#63ed7a, #34c759); color: white;">
                <iconify-icon icon="fluent:phone-24-filled"></iconify-icon>
            </div>
            <div class="icon-box" style="background: linear-gradient(#5ac8fa, #007aff); color: white;">
                <iconify-icon icon="fluent:mail-24-filled"></iconify-icon>
            </div>
            <div class="icon-box" style="background: linear-gradient(#ffcc00, #ff9500); color: white;">
                <iconify-icon icon="fluent:chat-24-filled"></iconify-icon>
            </div>
        </div>
    </div>

    <div class="home-indicator"></div>

    <script>
            function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12; 
            document.getElementById('ios-clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
